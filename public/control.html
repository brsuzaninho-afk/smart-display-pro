<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>Smart Display Pro — Controle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    :root{--accent:#ffd400;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(255,212,0,.1),transparent 28%),#050505;color:#fff;font-family:Inter,system-ui,sans-serif}.app{width:min(100%,760px);margin:auto;padding:0 18px 38px}.top{position:sticky;top:0;z-index:10;margin:0 -18px;padding:15px 18px;background:rgba(5,5,5,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950}.muted{color:#888;font-size:12px}.status{font-size:12px;font-weight:800;color:#8cff63}.card{margin-top:20px;border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015))}.title{font-size:13px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}.copy{font-size:13px;color:#888;margin-top:6px;line-height:1.45}.drop{margin-top:14px;min-height:142px;border:1.5px dashed #444;border-radius:16px;display:grid;place-items:center;text-align:center;padding:18px;cursor:pointer}.drop:hover{border-color:var(--accent)}.preview{display:none;margin-top:12px;padding:10px;border-radius:12px;background:#111;font-size:13px}.preview.show{display:block}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.mode{min-height:112px;border:1px solid var(--line);border-radius:15px;background:#0d0d0d;color:white;text-align:left;padding:12px;cursor:pointer}.mode.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.mode strong{display:block;margin-top:10px}.mode small{color:#777;display:block;margin-top:5px;line-height:1.3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.full{grid-column:1/-1}label{font-size:11px;color:#aaa;font-weight:800;display:block;margin-bottom:6px}input,textarea{width:100%;background:#0d0d0d;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}textarea{min-height:78px}.accent{display:flex;gap:10px;margin-top:8px}.dot{width:34px;height:34px;border-radius:999px;border:3px solid #050505;outline:1px solid #444;cursor:pointer}.dot.active{outline:2px solid #fff}.actions{position:sticky;bottom:0;padding-top:18px;background:linear-gradient(transparent,#050505 28%)}.send{width:100%;border:0;border-radius:15px;padding:16px;font-weight:1000;background:linear-gradient(135deg,#ffd400,#ff9f00);color:#090909;cursor:pointer}.secondary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.secondary button{border:1px solid var(--line);background:#111;color:#fff;border-radius:13px;padding:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#111;border:1px solid #333;border-radius:12px;padding:12px 16px;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.blocked{display:none;position:fixed;inset:0;background:#050505;z-index:50;place-items:center;text-align:center;padding:30px}.blocked.show{display:grid}@media(max-width:560px){.modes,.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <div id="blocked" class="blocked"><div><h1 class="text-2xl font-black">Sessão inválida</h1><p class="mt-2 text-neutral-400">Abra este controle escaneando o QR Code exibido na TV.</p></div></div>
  <div class="app">
    <div class="top"><div><div class="brand">Smart Display Pro</div><div id="sessionLabel" class="muted"></div></div><div id="connectionText" class="status">Conectando...</div></div>

    <section class="card"><div class="title">1. Mídia</div><div class="copy">Envie JPG, PNG, WEBP, GIF, MP4 ou WEBM.</div><label class="drop" for="mediaInput"><div><div class="text-2xl">＋</div><strong>Toque para escolher uma mídia</strong><div class="muted mt-1">até 200 MB</div></div></label><input id="mediaInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" hidden><div id="preview" class="preview"></div></section>

    <section class="card"><div class="title">2. Modo de exibição</div><div class="modes">
      <button class="mode active" data-mode="photo-motion"><span>01</span><strong>Foto + movimento</strong><small>Ken Burns, blur, copy e preço.</small></button>
      <button class="mode" data-mode="video-overlay"><span>02</span><strong>Vídeo + oferta</strong><small>Vídeo com elementos comerciais por cima.</small></button>
      <button class="mode" data-mode="video-pure"><span>03</span><strong>Vídeo puro</strong><small>Tela cheia sem textos.</small></button>
    </div></section>

    <section class="card"><div class="title">3. Conteúdo comercial</div><div class="grid">
      <div class="full"><label>Título</label><input id="title" placeholder="MEGA BURGER"></div>
      <div class="full"><label>Subtítulo</label><textarea id="subtitle" placeholder="Sabor, impacto e preço que chama atenção"></textarea></div>
      <div><label>Preço</label><input id="price" placeholder="R$ 24,90"></div><div><label>Preço anterior</label><input id="oldPrice" placeholder="R$ 34,90"></div>
      <div><label>Selo</label><input id="badge" value="OFERTA IMPERDÍVEL"></div><div><label>Desconto</label><input id="discount" value="DESCONTO EXCLUSIVO"></div>
      <div class="full"><label>Cor de destaque</label><div class="accent"><button class="dot active" data-accent="lime" style="background:#9cff00"></button><button class="dot" data-accent="yellow" style="background:#ffd400"></button><button class="dot" data-accent="red" style="background:#ff2340"></button><button class="dot" data-accent="cyan" style="background:#24eaff"></button></div></div>
    </div></section>

    <div class="actions"><button id="send" class="send">ENVIAR PARA A TV</button><div class="secondary"><button id="ping">Piscar TV</button><button id="clear">Limpar mídia</button></div></div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const params=new URLSearchParams(location.search),sessionId=params.get('session'),socket=io();
    const $=id=>document.getElementById(id),blocked=$('blocked'),connection=$('connectionText'),preview=$('preview'),input=$('mediaInput'),send=$('send'),toast=$('toast');
    let mode='photo-motion',accent='lime',file=null,currentMedia=null,joined=false,timer;
    $('sessionLabel').textContent=sessionId?`Sessão: ${sessionId.toUpperCase()}`:'';
    function msg(text){clearTimeout(timer);toast.textContent=text;toast.classList.add('show');timer=setTimeout(()=>toast.classList.remove('show'),2400)}
    function setConnection(on){connection.textContent=on?'Conectado à TV':'TV desconectada';connection.style.color=on?'#8cff63':'#ff9dac'}
    function hydrate(state){if(!state)return;mode=state.mode||mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));const c=state.content||{};['title','subtitle','price','oldPrice','badge','discount'].forEach(k=>{if(c[k]!==undefined)$(k).value=c[k]||''});accent=c.accent||accent;document.querySelectorAll('.dot').forEach(x=>x.classList.toggle('active',x.dataset.accent===accent));currentMedia=state.media||null;if(currentMedia?.originalName&&!file){preview.textContent=`Na TV: ${currentMedia.originalName}`;preview.classList.add('show')}else if(!currentMedia&&!file)preview.classList.remove('show')}
    function join(){if(!sessionId){blocked.classList.add('show');return}socket.emit('controller:join',{sessionId},r=>{if(!r?.ok){blocked.classList.add('show');return}joined=true;setConnection(Boolean(r.state?.connected?.tv));hydrate(r.state)})}
    function payload(){return{mode,content:{title:$('title').value.trim(),subtitle:$('subtitle').value.trim(),price:$('price').value.trim(),oldPrice:$('oldPrice').value.trim(),badge:$('badge').value.trim(),discount:$('discount').value.trim(),accent}}}
    async function upload(){if(!file)return null;const fd=new FormData();fd.append('file',file);const r=await fetch(`/api/upload?session=${encodeURIComponent(sessionId)}`,{method:'POST',body:fd});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Falha no upload');return j.media}
    async function sendTv(){if(!joined)return msg('A sessão ainda não conectou.');const effective=file?(file.type.startsWith('video/')?'video':'image'):currentMedia?.type;if(mode==='photo-motion'&&effective==='video')return msg('Foto + movimento precisa de imagem.');if((mode==='video-overlay'||mode==='video-pure')&&effective&&effective!=='video')return msg('Este modo precisa de vídeo.');send.disabled=true;send.textContent=file?'ENVIANDO MÍDIA...':'ATUALIZANDO TV...';try{const uploaded=await upload();if(uploaded)currentMedia=uploaded;await new Promise((ok,no)=>socket.emit('controller:update-display',payload(),r=>r?.ok?ok(r):no(new Error(r?.error||'Falha ao atualizar'))));file=null;input.value='';if(currentMedia?.originalName){preview.textContent=`Na TV: ${currentMedia.originalName}`;preview.classList.add('show')}msg('Conteúdo enviado para a TV.')}catch(e){msg(e.message||'Erro ao enviar')}finally{send.disabled=false;send.textContent='ENVIAR PARA A TV'}}
    document.querySelectorAll('.mode').forEach(x=>x.onclick=()=>{mode=x.dataset.mode;document.querySelectorAll('.mode').forEach(y=>y.classList.remove('active'));x.classList.add('active')});
    document.querySelectorAll('.dot').forEach(x=>x.onclick=()=>{accent=x.dataset.accent;document.querySelectorAll('.dot').forEach(y=>y.classList.remove('active'));x.classList.add('active')});
    input.onchange=()=>{file=input.files?.[0]||null;if(file){preview.textContent=file.name;preview.classList.add('show')}};
    send.onclick=sendTv;
    $('ping').onclick=()=>socket.emit('controller:ping-tv',{},r=>msg(r?.ok?'Sinal enviado à TV.':'TV indisponível.'));
    $('clear').onclick=()=>socket.emit('controller:clear-media',{},r=>{if(r?.ok){currentMedia=null;file=null;input.value='';preview.classList.remove('show');msg('Mídia removida da TV.')}else msg('Não foi possível limpar a mídia.')});
    socket.on('connect',join);socket.on('presence:update',p=>setConnection(Boolean(p?.tv)));socket.on('display:state',hydrate);socket.on('disconnect',()=>setConnection(false));
  </script>
</body>
</html>
